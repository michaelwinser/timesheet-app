# Docker Compose configuration for TrueNAS production deployment
# V2 Architecture (Go + Svelte)
#
# WARNING - see https://github.com/michaelwinser/timesheet-app/issues/105
# The postgres volume below is a bind mount, but the live TrueNAS deployment
# runs docker-compose.yaml and stores its data in the NAMED volume
# timesheet-app_postgres-data. Deploying this file as-is would bind-mount an
# empty directory, initialise a fresh cluster, and come up looking healthy with
# an empty database. Reconcile the volume before using this file.
#
# Usage:
#   1. Create deployment directory on TrueNAS
#   2. Copy this file to TrueNAS as docker-compose.yaml
#   3. Create .env file with secrets
#   4. Create data directories: mkdir -p ./postgres-data
#   5. Deploy: docker-compose up -d

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: timesheet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timesheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-timesheet_v2}
    volumes:
      # Host path volume for PostgreSQL data persistence
      # Mounts to a 'postgres-data' directory in the same location as this file
      - ${POSTGRES_DATA_PATH:-./postgres-data}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timesheet} -d ${POSTGRES_DB:-timesheet_v2}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  timesheet-api:
    # Build from source or use pre-built image
    build:
      context: .
      dockerfile: service/Dockerfile
    image: michaelwinser/timesheet-app:latest
    container_name: timesheet-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Map container port 8080 to host port (default 8000)
      - "${PORT:-8000}:8080"
    environment:
      # Server Configuration
      PORT: "8080"
      ENVIRONMENT: "production"

      # Database Connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-timesheet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-timesheet_v2}

      # Security
      # Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET}
      # Generate with: openssl rand -hex 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}

      # Optional: Anthropic API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 64M

    # Simple connectivity check since /health endpoint might not exist yet
    # or requires auth. Using wget to check if port is open/responding.
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
